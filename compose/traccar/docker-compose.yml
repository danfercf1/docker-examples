version: '3'

services:
  traccar-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${TRACCAR_DB_PASSWORD}
    volumes:
      - traccar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traccar -d traccar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traccar-network

  traccar:
    image: traccar/traccar:6.16.0
    container_name: traccar
    restart: unless-stopped
    depends_on:
      traccar-db:
        condition: service_healthy
    ports:
      - "5013:5013/tcp"
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://traccar-db:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${TRACCAR_DB_PASSWORD}
      PROTOCOLS_ENABLE: osmand,h02
      WEB_URL: https://gps.dfcfhub.org
      EVENT_FORWARD_URL: http://traccar-ntfy:8080/event
      EVENT_FORWARD_HEADER: "Authorization: Bearer ${TRACCAR_NTFY_GATEWAY_TOKEN:?TRACCAR_NTFY_GATEWAY_TOKEN no definido en .env}"
    volumes:
      - traccar-logs:/opt/traccar/logs
      - traccar-data:/opt/traccar/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - traccar-network
      - ghost-services

  traccar-ntfy:
    build: ./ntfy-gateway
    restart: unless-stopped
    depends_on:
      traccar:
        condition: service_healthy
    environment:
      GATEWAY_TOKEN: ${TRACCAR_NTFY_GATEWAY_TOKEN:?TRACCAR_NTFY_GATEWAY_TOKEN no definido en .env}
      NTFY_TOPIC_ADMIN: ${NTFY_TOPIC_ADMIN:?NTFY_TOPIC_ADMIN no definido en .env}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      COOLDOWN_MINUTES: ${COOLDOWN_MINUTES:-10}
      OFFLINE_SUSTAINED_MINUTES: ${OFFLINE_SUSTAINED_MINUTES:-15}
      TRACCAR_URL: ${TRACCAR_URL:-http://traccar:8082}
      TRACCAR_API_TOKEN: ${TRACCAR_API_TOKEN:?TRACCAR_API_TOKEN no definido en .env}
      TRACCAR_SERVICE_USER: ${TRACCAR_SERVICE_USER:?TRACCAR_SERVICE_USER no definido en .env}
      TRACCAR_CACHE_SECONDS: ${TRACCAR_CACHE_SECONDS:-300}
      STATE_DB: /srv/state/gateway.db
      SENT_LOG_DAYS: ${SENT_LOG_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./ntfy-gateway/config/events.yaml:/srv/config/events.yaml:ro
      - traccar-ntfy-state:/srv/state
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - traccar-network

networks:
  traccar-network:
  ghost-services:
    external: true

volumes:
  traccar-db-data:
  traccar-logs:
  traccar-data:
  # Estado del gateway ntfy (cooldowns, temporizadores, historial de envíos).
  # Reconstruible: NO forma parte de las copias de seguridad (ver
  # ntfy-gateway/docs/MANUAL-ADMIN.md).
  traccar-ntfy-state:
